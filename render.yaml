services:
  - type: web
    name: paypal-ai-checkout-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: MAX_CHECKOUT_USD
        value: "5000"
